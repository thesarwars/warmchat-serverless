<body>
  <div id="root"></div>
  <script>
    // Capture `beforeinstallprompt` synchronously, before the Vite module
    // bundle loads. Chrome only fires this event once and very early - if no
    // listener is attached at that exact moment the event is lost forever
    // and the in-app Install buttons can't open the native dialog. We stash
    // the deferred event on `window` so utils/pwaInstall.ts can pick it up
    // when its module finally executes.
    (function () {
      var persisted = false;
      try { persisted = localStorage.getItem("wc_pwa_installed") === "1"; } catch (_) {}
      window.__wcPwa = { event: null, installed: persisted };
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__wcPwa.event = e;
        // Chrome only fires this when the PWA is INSTALLABLE - i.e. not
        // currently installed. If our persistent flag still says "installed"
        // the user uninstalled outside the page. Clear it so the UI stops
        // showing the stale "Open the app" view.
        window.__wcPwa.installed = false;
        try { localStorage.removeItem("wc_pwa_installed"); } catch (_) {}
        window.dispatchEvent(new CustomEvent("wc:pwa-prompt-ready"));
      });
      window.addEventListener("appinstalled", function () {
        window.__wcPwa.installed = true;
        window.__wcPwa.event = null;
        try { localStorage.setItem("wc_pwa_installed", "1"); } catch (_) {}
        window.dispatchEvent(new CustomEvent("wc:pwa-installed"));
      });
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
