<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="600" fill="#FBF8F3"/>
  <text x="60" y="64" font-size="30" font-weight="800" fill="#211A14">Making a destructive action safe</text>
  <text x="60" y="96" font-size="16" fill="#7A6E60">Deleting a lead mid-campaign shouldn't leave ghosts — or keep texting a deleted contact.</text>

  <!-- delete node -->
  <g transform="translate(60,250)">
    <rect width="180" height="96" rx="18" fill="#FBEAEA" stroke="#F1CACA"/>
    <path d="M62 34 h56 M72 34 v-8 h36 v8 M72 34 v46 h36 v-46" stroke="#DC2626" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="86" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="middle">Delete lead</text>
  </g>

  <defs>
    <marker id="s" markerWidth="11" markerHeight="11" refX="7" refY="5.5" orient="auto"><path d="M0 0 L10 5.5 L0 11 z" fill="#CDBBA6"/></marker>
  </defs>
  <g stroke="#CDBBA6" stroke-width="2.2" fill="none">
    <path d="M240 274 C 290 274, 300 190, 350 190" marker-end="url(#s)"/>
    <path d="M240 292 C 290 292, 300 300, 350 300" marker-end="url(#s)"/>
    <path d="M240 316 C 290 316, 300 410, 350 410" marker-end="url(#s)"/>
  </g>

  <!-- outcome cards -->
  <g transform="translate(350,152)">
    <rect width="380" height="80" rx="14" fill="#E7F6EC" stroke="#BFE6CC"/>
    <path d="M26 40 l9 9 16 -18" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="34" font-size="15" font-weight="800" fill="#128A3E">Purge conversation history</text>
    <text x="66" y="58" font-size="12.5" fill="#2E7D4F">so a re-import starts clean</text>
  </g>
  <g transform="translate(350,262)">
    <rect width="380" height="80" rx="14" fill="#E7F6EC" stroke="#BFE6CC"/>
    <path d="M26 40 l9 9 16 -18" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="34" font-size="15" font-weight="800" fill="#128A3E">Cancel only pending sends</text>
    <text x="66" y="58" font-size="12.5" fill="#2E7D4F">no more texts to a deleted contact</text>
  </g>
  <g transform="translate(350,372)">
    <rect width="380" height="80" rx="14" fill="#FFF6EE" stroke="#F5E2CE"/>
    <circle cx="38" cy="40" r="14" fill="#F97316"/><path d="M38 32 v10 M38 47 v.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="66" y="34" font-size="15" font-weight="800" fill="#C0530F">Keep the opt-out record</text>
    <text x="66" y="58" font-size="12.5" fill="#8B7E6F">a “STOP” is never forgotten (compliance)</text>
  </g>

  <!-- untouched -->
  <g transform="translate(790,152)">
    <rect width="350" height="300" rx="16" fill="#fff" stroke="#EAE4DA"/>
    <text x="26" y="42" font-size="15" font-weight="800" fill="#211A14">Left untouched</text>
    <g font-size="13.5" fill="#5C5145">
      <text x="26" y="82">— the campaign / sequence definition</text>
      <text x="26" y="114">— every other enrolled lead's progress</text>
      <text x="26" y="146">— already-sent history (it happened,</text>
      <text x="26" y="166">   and it's billed)</text>
      <text x="26" y="198">— the billing / usage ledger</text>
    </g>
    <line x1="26" y1="224" x2="324" y2="224" stroke="#F1EBE2"/>
    <text x="26" y="254" font-size="12.5" fill="#8B7E6F">Scoped and reviewed before writing —</text>
    <text x="26" y="274" font-size="12.5" fill="#8B7E6F">delete touches analytics, billing &amp; live</text>
    <text x="26" y="294" font-size="12.5" fill="#8B7E6F">campaigns, so “mostly right” isn't enough.</text>
  </g>
</svg>
