<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="560" fill="#FBF8F3"/>
  <text x="60" y="64" font-size="30" font-weight="800" fill="#211A14">A bug that quietly destroys trust</text>
  <text x="60" y="96" font-size="16" fill="#7A6E60">"No more than 1.2" — the AI read $1.2M, but the extractor saved $1,200.</text>

  <!-- shared input -->
  <g transform="translate(430,150)">
    <rect width="340" height="56" rx="14" fill="#F3EEE7" stroke="#E3D8C9"/>
    <text x="24" y="35" font-size="15" fill="#3F362C">Lead: “No more than 1.2 …”</text>
  </g>
  <path d="M520 206 V244" stroke="#CDBBA6" stroke-width="2.2" fill="none"/>
  <path d="M680 206 V244" stroke="#CDBBA6" stroke-width="2.2" fill="none"/>

  <!-- before -->
  <g transform="translate(120,250)">
    <rect width="440" height="230" rx="18" fill="#fff" stroke="#F1CACA"/>
    <rect x="0" y="0" width="440" height="52" rx="18" fill="#FBEAEA"/>
    <rect x="0" y="30" width="440" height="22" fill="#FBEAEA"/>
    <circle cx="34" cy="26" r="12" fill="#DC2626"/><path d="M29 26 h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="56" y="32" font-size="16" font-weight="800" fill="#B91C1C">Before</text>
    <text x="30" y="98" font-size="14" fill="#6A5D50">parse “1.2” → ×1000</text>
    <text x="30" y="132" font-size="30" font-weight="800" fill="#B91C1C">$1,200</text>
    <text x="30" y="168" font-size="14" fill="#6A5D50">bucketed to</text>
    <g transform="translate(30,182)">
      <rect width="180" height="34" rx="17" fill="#FBEAEA"/>
      <text x="90" y="23" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="middle">Budget: Under $300k</text>
    </g>
  </g>

  <!-- after -->
  <g transform="translate(640,250)">
    <rect width="440" height="230" rx="18" fill="#fff" stroke="#BFE6CC"/>
    <rect x="0" y="0" width="440" height="52" rx="18" fill="#E7F6EC"/>
    <rect x="0" y="30" width="440" height="22" fill="#E7F6EC"/>
    <circle cx="34" cy="26" r="12" fill="#16A34A"/><path d="M29 26 l3 3 6 -6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="32" font-size="16" font-weight="800" fill="#128A3E">After</text>
    <text x="30" y="98" font-size="14" fill="#6A5D50">decimal in a price = millions</text>
    <text x="30" y="132" font-size="30" font-weight="800" fill="#128A3E">$1.2M</text>
    <text x="30" y="168" font-size="14" fill="#6A5D50">bucketed to</text>
    <g transform="translate(30,182)">
      <rect width="140" height="34" rx="17" fill="#E7F6EC"/>
      <text x="70" y="23" font-size="14" font-weight="700" fill="#128A3E" text-anchor="middle">Budget: $1M+</text>
    </g>
    <text x="240" y="204" font-size="12" fill="#7A6E60">…and ignores “2.5 bath” in the</text>
    <text x="240" y="220" font-size="12" fill="#7A6E60">same sentence.</text>
  </g>

  <text x="60" y="524" font-size="13.5" fill="#8B7E6F">Small parser change · unit-tested across "1.2", "around 400", "$1.2M", "2.5 bath" · verified on production data.</text>
</svg>
