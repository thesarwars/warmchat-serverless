<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="620" fill="#FBF8F3"/>
  <text x="60" y="64" font-size="30" font-weight="800" fill="#211A14">The AI qualification loop</text>
  <text x="60" y="96" font-size="16" fill="#7A6E60">Detect intent, ask one question at a time, save every answer, then push to a booking.</text>

  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="7" refY="5.5" orient="auto"><path d="M0 0 L10 5.5 L0 11 z" fill="#F0A868"/></marker>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FB8B3C"/><stop offset="1" stop-color="#EA5D0B"/></linearGradient>
  </defs>

  <!-- steps -->
  <g>
    <g transform="translate(60,170)">
      <rect width="200" height="120" rx="16" fill="#fff" stroke="#EAE4DA"/>
      <circle cx="30" cy="34" r="15" fill="#F3EEE7"/><path d="M23 34 h14 M23 40 h9" stroke="#6A5D50" stroke-width="2.4" stroke-linecap="round"/>
      <text x="20" y="76" font-size="16.5" font-weight="800" fill="#211A14">Inbound reply</text>
      <text x="20" y="98" font-size="12.5" fill="#7A6E60">SMS · email</text>
    </g>
    <g transform="translate(300,170)">
      <rect width="200" height="120" rx="16" fill="#fff" stroke="#EAE4DA"/>
      <text x="20" y="42" font-size="15" font-weight="800" fill="#C0530F">Detect intent</text>
      <text x="20" y="70" font-size="12.5" fill="#6A5D50">buyer / seller / both</text>
      <text x="20" y="90" font-size="12.5" fill="#6A5D50">booking / not-interested</text>
      <text x="20" y="110" font-size="12.5" fill="#6A5D50">before qualifying</text>
    </g>
    <g transform="translate(540,170)">
      <rect width="220" height="120" rx="16" fill="url(#og)"/>
      <text x="20" y="42" font-size="15" font-weight="800" fill="#fff">Ask next qualifier</text>
      <text x="20" y="70" font-size="12.5" fill="#FFEEDD">one question at a time</text>
      <text x="20" y="90" font-size="12.5" fill="#FFEEDD">budget → timeline →</text>
      <text x="20" y="110" font-size="12.5" fill="#FFEEDD">financing (buyer)</text>
    </g>
    <g transform="translate(800,170)">
      <rect width="200" height="120" rx="16" fill="#fff" stroke="#EAE4DA"/>
      <text x="20" y="42" font-size="15" font-weight="800" fill="#211A14">Save to CRM</text>
      <text x="20" y="70" font-size="12.5" fill="#6A5D50">normalize + provenance</text>
      <text x="20" y="90" font-size="12.5" fill="#6A5D50">never overwrite a</text>
      <text x="20" y="110" font-size="12.5" fill="#6A5D50">human's manual edit</text>
    </g>
    <g transform="translate(1040,170)">
      <rect width="100" height="120" rx="16" fill="#E7F6EC" stroke="#BFE6CC"/>
      <text x="50" y="52" font-size="14" font-weight="800" fill="#128A3E" text-anchor="middle">Book</text>
      <text x="50" y="74" font-size="12.5" fill="#2E7D4F" text-anchor="middle">or</text>
      <text x="50" y="96" font-size="14" font-weight="800" fill="#128A3E" text-anchor="middle">Escalate</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#F0A868" stroke-width="2.6" fill="none">
    <path d="M260 230 H300" marker-end="url(#ar)"/>
    <path d="M500 230 H540" marker-end="url(#ar)"/>
    <path d="M760 230 H800" marker-end="url(#ar)"/>
    <path d="M1000 230 H1040" marker-end="url(#ar)"/>
  </g>

  <!-- loop -->
  <g stroke="#C0530F" stroke-width="2.4" fill="none" stroke-dasharray="6 6">
    <path d="M900 290 V360 H650 V292" marker-end="url(#ar)"/>
  </g>
  <g transform="translate(636,368)">
    <rect width="300" height="34" rx="17" fill="#FDEBDD"/>
    <text x="150" y="23" font-size="13" font-weight="700" fill="#C0530F" text-anchor="middle">loop until all answers are on file</text>
  </g>

  <!-- footer note -->
  <g transform="translate(60,452)">
    <rect width="1080" height="112" rx="16" fill="#fff" stroke="#EAE4DA"/>
    <rect x="0" y="0" width="7" height="112" rx="3.5" fill="#F97316"/>
    <text x="30" y="42" font-size="16" font-weight="800" fill="#211A14">Stop rules &amp; hand-off</text>
    <text x="30" y="72" font-size="13.5" fill="#6A5D50">Reply from the lead pauses campaign logic and prioritizes a response. A "STOP" opts them out.</text>
    <text x="30" y="94" font-size="13.5" fill="#6A5D50">Anything needing a human (pricing, legal, ready-to-transact) escalates with a task for the agent.</text>
  </g>
</svg>
