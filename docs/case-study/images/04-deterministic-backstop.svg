<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="560" fill="#FBF8F3"/>
  <text x="60" y="64" font-size="30" font-weight="800" fill="#211A14">A deterministic safety net under the LLM</text>
  <text x="60" y="96" font-size="16" fill="#7A6E60">The model's tool call is an enhancement — not a single point of failure.</text>

  <defs>
    <marker id="d" markerWidth="11" markerHeight="11" refX="7" refY="5.5" orient="auto"><path d="M0 0 L10 5.5 L0 11 z" fill="#C9A97F"/></marker>
  </defs>

  <!-- inbound -->
  <g transform="translate(60,240)">
    <rect width="150" height="80" rx="16" fill="#F3EEE7" stroke="#E3D8C9"/>
    <text x="75" y="40" font-size="14" font-weight="800" fill="#3F362C" text-anchor="middle">Inbound</text>
    <text x="75" y="60" font-size="13" fill="#6A5D50" text-anchor="middle">reply</text>
  </g>

  <!-- lane 1 deterministic -->
  <g transform="translate(300,150)">
    <rect width="360" height="96" rx="16" fill="#E7F6EC" stroke="#BFE6CC"/>
    <text x="24" y="38" font-size="16" font-weight="800" fill="#128A3E">Deterministic classifier</text>
    <text x="24" y="64" font-size="13" fill="#2E7D4F">runs FIRST · always persists structured</text>
    <text x="24" y="83" font-size="13" fill="#2E7D4F">fields before the model even responds</text>
    <rect x="300" y="34" width="46" height="28" rx="14" fill="#16A34A"/>
    <text x="323" y="53" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">100%</text>
  </g>

  <!-- lane 2 LLM -->
  <g transform="translate(300,314)">
    <rect width="360" height="96" rx="16" fill="#F3E9FB" stroke="#DEC6F6"/>
    <text x="24" y="38" font-size="16" font-weight="800" fill="#6D28D9">LLM tool-calling agent</text>
    <text x="24" y="64" font-size="13" fill="#7C3AED">natural conversation · books, escalates,</text>
    <text x="24" y="83" font-size="13" fill="#7C3AED">enriches — when it chooses to call a tool</text>
    <rect x="300" y="34" width="46" height="28" rx="14" fill="#7C3AED"/>
    <text x="323" y="53" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">~best</text>
  </g>

  <!-- merge to CRM -->
  <g transform="translate(760,240)">
    <rect width="180" height="80" rx="16" fill="#fff" stroke="#EAE4DA"/>
    <text x="90" y="40" font-size="16" font-weight="800" fill="#211A14" text-anchor="middle">CRM</text>
    <text x="90" y="62" font-size="12.5" fill="#7A6E60" text-anchor="middle">always correct</text>
  </g>

  <!-- arrows -->
  <g stroke="#C9A97F" stroke-width="2.4" fill="none">
    <path d="M210 268 C 250 268, 250 198, 300 198" marker-end="url(#d)"/>
    <path d="M210 292 C 250 292, 250 362, 300 362" marker-end="url(#d)"/>
    <path d="M660 198 C 710 198, 710 268, 760 268" marker-end="url(#d)"/>
    <path d="M660 362 C 710 362, 710 292, 760 292" marker-end="url(#d)"/>
  </g>

  <g transform="translate(60,452)">
    <rect width="880" height="70" rx="14" fill="#FFF6EE" stroke="#F5E2CE"/>
    <text x="26" y="42" font-size="14.5" fill="#5C5145">If the model skips its "save" tool on a turn, the deterministic pass has already captured the facts.</text>
  </g>
</svg>
