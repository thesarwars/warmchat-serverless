#:schema node_modules/wrangler/config-schema.json
# WarmChats - Cloudflare Pages backend (D1 + Functions).
#
# Values in [vars] are pushed to the Pages PRODUCTION environment on
# `pnpm upload` / `wrangler pages deploy dist`. For local dev `wrangler pages
# dev` reads .dev.vars instead (overrides anything here).
#
# SECURITY NOTE: every value below ends up in your git history. If you'd
# rather keep secrets out of the repo, blank them here and run:
#   wrangler pages secret put KEY_NAME --project-name warmchats
# That stores them encrypted on Cloudflare's side; they still appear at
# runtime as `env.KEY_NAME` to your Functions.

name = "warmchats"
pages_build_output_dir = "./dist"
compatibility_date = "2026-05-22"
# compatibility_flags = ["nodejs_compat"]

# ---- D1 database binding (warmchats-db) ----
[[d1_databases]]
binding = "D1DB"
database_name = "warmchats-db"
database_id = "0b04e966-f093-4a68-9951-ce54958d09b3"
# preview_database_id = "DB" # Required for Pages local development

# [observability.logs]
