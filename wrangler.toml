# =============================================================================
# Calling sidecar Worker bindings
# =============================================================================
# Service binding: lets Pages Functions call into the gateway Worker (which hosts
# the Durable Objects). The Worker is deployed separately from gateway-worker/.
[[services]]
binding = "GATEWAY"
service = "warmchats-calling-gateway"

# Durable Object bindings re-exported through the gateway Worker's script. Pages
# Functions don't instantiate DOs directly - they go through GATEWAY.fetch(...) -
# but declaring them documents the wiring and keeps the binding names stable.
[[durable_objects.bindings]]
name = "USER_SOCKET"
class_name = "UserSocketDO"
script_name = "warmchats-calling-gateway"

[[durable_objects.bindings]]
name = "CALL_ACTOR"
class_name = "CallActorDO"
script_name = "warmchats-calling-gateway"

# =============================================================================
# Other bindings
# =============================================================================
[[r2_buckets]]                # attachments / media (Phase 8 - inbox uploads)
binding = "ATTACHMENTS"
bucket_name = "warmchats-attachments"
# preview_bucket_name = "warmchats-attachments-preview"

